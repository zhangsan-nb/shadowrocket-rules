name: Approve one-time V2 rules scope migration

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type REBASELINE-V2 to approve the audited one-time scope migration
        required: true
        type: string

concurrency:
  group: trusted-rules-release
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.inputs.approval == 'REBASELINE-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pytest -q
      - run: >-
          python scripts/build.py --ci
          --scope-migration config/migrations/v2-scope.json
      - run: python scripts/validate.py
      - run: python scripts/seal.py create
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/candidate.zip
            dist/candidate.zip.sha256
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
      - run: >-
          python scripts/seal.py verify
          --archive downloaded/candidate.zip
          --digest downloaded/candidate.zip.sha256
          --output candidate-verified
      - run: bash scripts/publish.sh candidate-verified
